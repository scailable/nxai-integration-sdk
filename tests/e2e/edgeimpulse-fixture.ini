# Fixture ini for e2e-edgeimpulse. Two settings below are load-bearing;
# neither can be had from the shipped plugin.edgeimpulse.ini.example.
#
# auto_generator = False is what makes the scenario meaningful. The shipped example
# sets auto_generator = True with auto_generator_every_seconds = 1, which queues a
# sample off a wall-clock timer regardless of frame content -- so the scenario would
# still see samples queued, and still pass, even if the confidence/ImageData path it
# means to cover were completely broken. With the timer off, the below-p_value
# confidence of the harness-seeded frame is the only thing that can queue a sample.
#
# api_key must be present and not equal to the processor's
# DEFAULT_EDGE_IMPULSE_API_KEY placeholder ("ei_your_key_here", the shipped example's
# key): the fallback for a missing key is that placeholder, and the processor exits(1)
# before IPC init when it sees it, which the harness reports as "did not signal ready".
#
# The key here is syntactically plausible but inert; the scenario never queues enough
# samples to reach samples_buffer_flush_size, so it never triggers a real upload.
[common]
debug_level=DEBUG
[edgeimpulse]
api_key = ei_e2e0000000000000000000000000000000000000000000
auto_generator = False
auto_generator_every_seconds = 1
samples_buffer_flush_size = 20
p_value = 0.4
